<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Organizer sign in')}"></head>
<body>
<nav th:replace="~{fragments :: nav(true)}"></nav>
<main class="auth-wrap"><div class="glass auth-card">
  <a th:href="@{/login}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Choose another role</a>
  <div class="text-center my-3">
    <div class="fs-1 grad-text"><i class="bi bi-calendar2-event"></i></div>
    <h2>Organizer <span class="grad-text">sign in</span></h2>
    <p class="text-white-50">Manage your events, customers, payments and tickets.</p>
  </div>
  <div th:replace="~{fragments :: flash}"></div>
  <form th:action="@{/login/organizer}" method="post" autocomplete="on">
    <div class="mb-3"><label for="email">Email</label><input type="email" class="form-control form-control-lg" id="email" name="email" maxlength="150" required autofocus></div>
    <div class="mb-3"><label for="pw">Password</label><input type="password" class="form-control form-control-lg" id="pw" name="password" maxlength="72" required autocomplete="current-password"></div>
    <button class="btn btn-cyan w-100 py-3">Sign in <i class="bi bi-arrow-right"></i></button>
  </form>
  <p class="text-center small mt-3 mb-0">New organizer? <a th:href="@{/register/organizer}">Register here</a></p>
</div></main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
