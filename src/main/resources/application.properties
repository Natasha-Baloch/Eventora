spring.application.name=Eventora
server.port=8080

# ---------- MySQL (edit user / password) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/eventora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Natasha@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
eventora.upload-dir=uploads

# ---------- Email (OTP + notifications) ----------
# Leave spring.mail.host empty to print OTP codes in the console (development).
# Gmail example: host=smtp.gmail.com port=587 username=you@gmail.com password=<app password>
spring.mail.host=
spring.mail.port=587
spring.mail.username=root
spring.mail.password=Natasha@123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
eventora.mail-from=no-reply@eventora.local

# ---------- App ----------
eventora.currency=PKR
eventora.admin-email=admin@eventora.local
eventora.commission-percent=10
eventora.otp-secret=change-this-otp-secret-please
eventora.payment-secret=change-this-payment-secret-please
eventora.payment-window-minutes=30
eventora.request-window-hours=48
eventora.seed-sample-data=true
eventora.download-sample-images=false
eventora.open-browser=true

# ---------- Demo accounts (passwords are stored as BCrypt hashes) ----------
eventora.admin-password=Admin@12345
eventora.demo-organizer-password=Organizer@123

# Customer sign-in: false = just type your email (no code). true = email a 6-digit code first (more secure).
eventora.customer-otp-required=false

# ---------- Error pages: show the real cause on the 500 page while developing (set false before going public) ----------
eventora.show-error-details=true
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=never
server.error.include-stacktrace=never
